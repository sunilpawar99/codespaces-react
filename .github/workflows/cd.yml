name: Node.js CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build --if-present

      - name: Create deployment package
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            -czf /tmp/nodejs-app.tar.gz .
      
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-app
          path: /tmp/nodejs-app.tar.gz
          if-no-files-found: error


  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-app
          path: artifact

      - name: Extract application
        run: |
          mkdir deployment
          tar -xzf artifact/nodejs-app.tar.gz -C deployment

      - name: Install production dependencies
        working-directory: deployment
        run: npm ci

      - name: Start application
        working-directory: deployment
        run: |
          nohup npm start > app.log 2>&1 &
          echo $! > app.pid

          sleep 5

          cat app.log

      - name: DEV smoke test
        run: |
          echo "Testing DEV application..."

          curl --fail http://localhost:3000

          echo "DEV deployment successful"


  deploy-prod:
    name: Deploy to PROD
    needs: deploy-dev
    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-app
          path: artifact

      - name: Extract application
        run: |
          mkdir deployment
          tar -xzf artifact/nodejs-app.tar.gz -C deployment

      - name: Install production dependencies
        working-directory: deployment
        run: npm ci

      - name: Start application
        working-directory: deployment
        run: |
          nohup npm start > app.log 2>&1 &
          echo $! > app.pid

          sleep 5

          cat app.log

      - name: PROD smoke test
        run: |
          echo "Testing PROD application..."

          curl --fail http://localhost:3000

          echo "PRODUCTION deployment successful"
